[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "pyserq"
# the serq crate's version, as maturin writes it (0.1.1-dev.3 -> 0.1.1.dev3);
# written only in Cargo.toml (scripts/version.py)
dynamic = ["version"]
description = "serQ in Python: compile a program to its IR and run it, in process"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Documentation = "https://vrvrv.github.io/serQ/python/"

[tool.maturin]
module-name = "pyserq"
