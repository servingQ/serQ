name = "Serq"
defaultTargets = ["Serq", "papers"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
pp.unicode.fun = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0"

[[lean_lib]]
name = "Serq"

# the proofs about the paper programs, beside them in examples/papers/
[[lean_lib]]
name = "papers"
srcDir = "../examples"
roots = []
globs = ["papers.+"]

# performance probe: the executable semantics on a workload from a JSON file
[[lean_exe]]
name = "serq-lean-bench"
root = "Bench.Main"
