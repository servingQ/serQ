[package]
name = "seq-lang"
version = "0.1.0-dev2"
edition = "2024"
rust-version = "1.85"
description = "seQ: seQ, a language for formal verification and simulation of LLM serving systems (interpreter and CLI)"
repository = "https://github.com/vrvrv/seQ"
readme = "README.md"
keywords = ["llm", "serving", "queueing", "simulation", "vllm"]
categories = ["simulation", "science"]
include = ["src/**", "tests/**", "programs/**", "tools/oracle/**", "Cargo.toml", "Cargo.lock", "README.md", "rust-toolchain.toml"]

[lib]
name = "seq"
path = "src/lib.rs"

[[bin]]
name = "seq-lang"
path = "src/main.rs"

[dependencies]
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
