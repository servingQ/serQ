[workspace]
members = [".", "pyserq"]
# `cargo build`, `test` and `clippy` at the root mean the language; the
# Python binding builds with `-p pyserq` or maturin (pyserq/)
default-members = ["."]

[workspace.package]
version = "0.1.2"
license = "Apache-2.0"

# one pyo3 for serq's `python` feature and pyserq (pyo3-ffi links python once)
[workspace.dependencies]
pyo3 = "0.25"
# one rand for the engine's streams and pyserq's `Rng`
rand = "0.9"

[package]
name = "serq"
version.workspace = true
license.workspace = true
edition = "2024"
rust-version = "1.85"
description = "serQ: serQ, a language for formal verification and simulation of LLM serving systems (interpreter and CLI)"
repository = "https://github.com/servingQ/serQ"
readme = "README.md"
keywords = ["llm", "serving", "queueing", "simulation", "vllm"]
categories = ["simulation", "science"]
include = ["src/**", "tests/**", "examples/**", "lib/**", "tools/oracle/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "rust-toolchain.toml"]

[lib]
name = "serq"
path = "src/lib.rs"

[[bin]]
name = "serq"
path = "src/main.rs"

[dependencies]
rand = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# `python`: a report's stage and pool rows are Python classes (pyserq)
pyo3 = { workspace = true, optional = true }

[features]
python = ["dep:pyo3"]

[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
