[package]
name = "serq"
version = "0.1.0-rc5"
edition = "2024"
rust-version = "1.85"
description = "serQ: serQ, a language for formal verification and simulation of LLM serving systems (interpreter and CLI)"
repository = "https://github.com/vrvrv/serQ"
readme = "README.md"
keywords = ["llm", "serving", "queueing", "simulation", "vllm"]
categories = ["simulation", "science"]
include = ["src/**", "tests/**", "examples/**", "lib/**", "tools/oracle/**", "Cargo.toml", "Cargo.lock", "README.md", "rust-toolchain.toml"]

[lib]
name = "serq"
path = "src/lib.rs"

[[bin]]
name = "serq"
path = "src/main.rs"

[dependencies]
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
