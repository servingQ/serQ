<text x="197" y="295" text-anchor="start" font-size="8" fill="#6b7280" class="dim">(o - 1 - (known - prompt))</text>
<text x="69" y="318" text-anchor="start" font-size="10" fill="#1d2021">]</text>
<text x="83" y="318" text-anchor="start" font-size="8" fill="#1d2021">release</text>
<text x="69" y="344" text-anchor="start" font-size="10" fill="#1d2021">o</text>
<text x="83" y="344" text-anchor="start" font-size="8" fill="#1d2021">observe response = now - t0</text>
<text x="69" y="370" text-anchor="start" font-size="10" fill="#1d2021">?</text>
<text x="83" y="370" text-anchor="start" font-size="8" fill="#1d2021">branch (more)</text>
