<text x="69" y="240" text-anchor="start" font-size="10" fill="#1d2021">?</text>
<text x="83" y="240" text-anchor="start" font-size="8" fill="#1d2021">branch (known == prompt)</text>
<text x="69" y="266" text-anchor="start" font-size="10" fill="#1d2021">o</text>
<text x="83" y="266" text-anchor="start" font-size="8" fill="#1d2021">observe ttft = now - t0</text>
