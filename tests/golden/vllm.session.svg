<text x="197" y="399" text-anchor="start" font-size="8" fill="#6b7280" class="dim">(~exp(3))</text>
<text x="69" y="422" text-anchor="start" font-size="10" fill="#1d2021">*</text>
<text x="83" y="422" text-anchor="start" font-size="8" fill="#1d2021">turn</text>
