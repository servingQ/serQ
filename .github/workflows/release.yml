name: Release

# Push an annotated tag vX.Y.Z matching Cargo.toml's version:
#   git tag -a v0.1.0-rc0 && git push origin v0.1.0-rc0   (a tag with "-" is a prerelease)
# The full CI runs first; the release carries the packaged crate and the
# Linux CLI, and the Python binding pyserq as wheels (linux x86_64, macOS
# arm64). Its notes are the tag message's body (what the release is,
# written by hand) followed by GitHub's generated list of the pull requests
# since the previous release. Consumers pin the tag (Cargo `git` + `tag`).

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to (re)release"
        required: true

permissions:
  contents: write

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  wheels:
    # pyserq, the Python binding: one abi3 wheel per platform, built with
    # the toolchain rust-toolchain.toml pins (rustup reads it in the
    # manylinux container too)
    needs: check
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64
            manylinux: auto
          - os: macos-14
            target: aarch64
            manylinux: "off"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked -m pyserq/Cargo.toml -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  release:
    needs: [check, wheels]
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Fetch the annotated tag
        # actions/checkout leaves a lightweight tag behind; the message is
        # only on the annotated one (actions/checkout#290)
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
      - name: Tag matches Cargo.toml
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$v" = "$TAG" || { echo "::error::tag $TAG but Cargo.toml says $v"; exit 1; }
      - name: Install pinned Rust toolchain
        run: rustup toolchain install && cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Build the CLI and package the crate
        run: |
          cargo build --release --locked
          cargo package --locked --allow-dirty
          mkdir -p dist
          cp target/package/serq-*.crate dist/
          tar -C target/release -czf "dist/serq-$TAG-x86_64-unknown-linux-gnu.tar.gz" serq
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Checksums
        # once, over everything the release carries (a SHA256SUMS already in
        # dist would list itself)
        run: (cd dist && sha256sum *.crate *.tar.gz *.whl > SHA256SUMS && cat SHA256SUMS)
      - name: Release notes
        # the tag message's body, then the generated pull request list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            git tag -l --format='%(contents:body)' "$TAG"
            echo
            gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body
          } > notes.md
          cat notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            pre=""; case "$TAG" in *-*) pre="--prerelease";; esac   # v0.1.0-rc0 etc.
            gh release create "$TAG" dist/* --title "serQ $TAG" --notes-file notes.md --verify-tag $pre
          fi

  crates-io:
    # Off by default: crates.io is public and permanent. Enable with the
    # repository variable PUBLISH_CRATES_IO=true and the secret
    # CARGO_REGISTRY_TOKEN, after adding a `license` to Cargo.toml.
    needs: release
    if: vars.PUBLISH_CRATES_IO == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - run: rustup toolchain install
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
