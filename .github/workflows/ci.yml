name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  rust:
    name: seQ interpreter (seq-lang)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: fmt, clippy, tests, programs link, oracles agree
        run: scripts/check_rust.sh

