name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - examples/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - examples/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  workflow_dispatch:

# One deployment at a time on main, where a newer commit supersedes an
# in-flight one. Keyed by ref, or two pull requests touching the docs cancel
# each other's build and neither reports.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      # The pages include programs/*.serq and docs/tutorial/programs/*.serq with
      # pymdownx.snippets, so --strict fails if one is renamed or removed.
      - run: mkdocs build --strict
      # A reviewer of a docs pull request can download this and open it.
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 30
      # Only the deploying run needs the Pages configuration. A pull request
      # builds and stops, so it must not fail merely because Pages is off.
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    # The site is public (docs/publishing.md). Only main publishes; a pull
    # request builds and uploads the artifact and stops there.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
