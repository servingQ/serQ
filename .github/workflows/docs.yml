name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - programs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - programs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      # The pages include programs/*.seq and docs/tutorial/programs/*.seq with
      # pymdownx.snippets, so --strict fails if one is renamed or removed.
      - run: mkdocs build --strict
      # The site is an artifact rather than a deployment: this repository is
      # private, its documentation quotes unpublished measurements and
      # pre-registered predictions, and GitHub Pages for a private repository
      # needs a plan that supports private Pages. Anyone with repository access
      # can download this and open index.html. To publish instead, see
      # `docs/publishing.md`.
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 30
