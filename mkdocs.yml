site_name: serQ
site_description: A language for the formal verification and simulation of LLM serving systems
site_url: https://servingq.github.io/serQ/
repo_url: https://github.com/servingQ/serQ
repo_name: servingQ/serQ
edit_uri: edit/main/docs/
copyright: serQ — a serving deployment is a program

theme:
  name: material
  logo: assets/brand/serq-mark-dark.svg
  favicon: assets/brand/favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode

hooks:
  - docs/hooks/serq_lexer.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/serq.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - User Guide:
      - Getting started: getting-started.md
      - Tutorial:
          - tutorial/index.md
          - 1. A queue: tutorial/01-a-queue.md
          - 2. Memory is a resource: tutorial/02-memory.md
          - 3. Sessions and turns: tutorial/03-sessions.md
          - 4. The prefix cache: tutorial/04-prefix-cache.md
          - 5. The engine: tutorial/05-the-engine.md
          - 6. The cliff: tutorial/06-the-cliff.md
      - Working with a program: development.md
      - The Lean model: lean.md
      - Visualization:
          - visualization/index.md
          - Deployment view: visualization/deployment.md
  - Use cases:
      - use-cases/index.md
      - Simulation:
          - vLLM: use-cases/vllm.md
          - vllm-ascend: use-cases/ascend.md
          - vllm-rbln: use-cases/rbln.md
          - Input shapes and padding: use-cases/input-shapes.md
          - Different workloads: use-cases/workloads.md
          - Prefill/decode over NIXL: use-cases/pd.md
          - FasterTransformer: use-cases/fastertransformer.md
      - Formal verification:
          - Throughput-optimal scheduling (Dai et al.): use-cases/dai.md
          - "RAD: optimal tiling (Bari et al.)": use-cases/bari.md
          - Smallest Volume First (Kong et al.): use-cases/kong.md
  - API Reference:
      - api/index.md
      - Program: api/program.md
      - Pool: api/pool.md
      - Stage: api/stage.md
      - Workload: api/workload.md
      - Statements: api/statements.md
      - Serving vocabulary: api/serving.md
      - Functions: api/functions.md
      - Distributions: api/distributions.md
      - Context variables: api/context.md
      - Attributes: api/attributes.md
      - Specification:
          - Cheatsheet: reference/cheatsheet.md
          - The language: language.md
          - The IR: ir.md
  - CLI Reference:
      - reference/cli.md
  - Python Reference:
      - python.md
  - Design:
      - design/index.md
      - Philosophy: design/philosophy.md
      - The stochastic process: design/stochastic-model.md
      - Frontend: design/frontend.md
      - Subagents: design/subagents.md
      - The KV transfer: design/pd-transfer.md
      - Renewal arrivals: design/renewal-arrivals.md
      - Bandwidth sharing: design/bandwidth-sharing.md
      - One admission: design/one-admission.md
      - Separate prefill/decode batches: design/exclusive-prefill.md
      - Serving a subset: design/serve-only.md
      - Claims: design/claims.md
      - Stability: design/stability.md
      - Waiting selection: design/waiting-selection.md
      - Queues: design/queue.md
      - Explicit gateways: design/explicit-gateways.md
      - The pull relation: design/pull-relation.md
      - The push mode: design/push-mode.md
      - Engine neutrality: design/engine-neutrality.md
      - A serving specification language: design/serving-specification-language.md
