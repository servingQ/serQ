<text x="98" y="135" text-anchor="start" font-size="8" fill="#6b7280" class="dim">new sessions: closed, 32 live</text>
<path class="flow" fill="none" stroke="#4b5563" stroke-width="1.3" data-role="exit" data-from="#0" data-to="#client" d="M324.2 171 L324.2 347 L72.8 347 L72.8 171" marker-end="url(#a)"/>
<text x="328.2" y="342" text-anchor="start" font-size="8" fill="#6b7280" class="dim">prompt + 100 &gt;= 4000 * 16</text>
<path class="flow" fill="none" stroke="#4b5563" stroke-width="1.3" data-role="flow" data-from="#0" data-to="#1" d="M345.2 145 L605.6 145" marker-end="url(#a)"/>
<text x="351.2" y="137" text-anchor="start" font-size="8" fill="#6b7280" class="dim">else</text>
