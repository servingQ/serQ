<path class="flow" fill="none" stroke="#4b5563" stroke-width="1.3" data-role="exit" data-from="E" data-to="#client" d="M1043.2 145 L1232.8 145 L1232.8 391 L72.8 391 L72.8 171" marker-end="url(#a)"/>
<text x="255.2" y="63" text-anchor="start" font-size="10" fill="#1d2021">server</text>
<text x="28" y="425" text-anchor="start" font-size="10" fill="#1d2021">deployment</text>
<text x="28" y="438" text-anchor="start" font-size="8" fill="#1d2021">J</text>
<text x="95.6" y="438" text-anchor="start" font-size="8" fill="#1d2021">2</text>
<text x="322" y="438" text-anchor="start" font-size="8" fill="#6b7280" class="dim">vLLM replicas (--backends)</text>
<text x="28" y="449" text-anchor="start" font-size="8" fill="#1d2021">B</text>
<text x="95.6" y="449" text-anchor="start" font-size="8" fill="#1d2021">8192</text>
<text x="322" y="449" text-anchor="start" font-size="8" fill="#6b7280" class="dim">max_num_batched_tokens</text>
<text x="28" y="460" text-anchor="start" font-size="8" fill="#1d2021">max_seqs</text>
<text x="95.6" y="460" text-anchor="start" font-size="8" fill="#1d2021">256</text>
<text x="322" y="460" text-anchor="start" font-size="8" fill="#6b7280" class="dim">max_num_seqs</text>
<text x="28" y="471" text-anchor="start" font-size="8" fill="#1d2021">bs</text>
<text x="95.6" y="471" text-anchor="start" font-size="8" fill="#1d2021">16</text>
<text x="322" y="471" text-anchor="start" font-size="8" fill="#6b7280" class="dim">block_size</text>
<text x="28" y="482" text-anchor="start" font-size="8" fill="#1d2021">c0</text>
<text x="95.6" y="482" text-anchor="start" font-size="8" fill="#1d2021">0</text>
<text x="322" y="482" text-anchor="start" font-size="8" fill="#6b7280" class="dim">fixed cost per iteration (s)</text>
<text x="28" y="493" text-anchor="start" font-size="8" fill="#1d2021">buffer</text>
<text x="95.6" y="493" text-anchor="start" font-size="8" fill="#1d2021">100</text>
<text x="322" y="493" text-anchor="start" font-size="8" fill="#6b7280" class="dim">BUFFER_PER_PROGRAM: decode headroom per program (tokens)</text>
<text x="28" y="504" text-anchor="start" font-size="8" fill="#1d2021">system</text>
<text x="95.6" y="504" text-anchor="start" font-size="8" fill="#1d2021">0</text>
<text x="322" y="504" text-anchor="start" font-size="8" fill="#6b7280" class="dim">the key of the system prompt every program shares</text>
<text x="28" y="515" text-anchor="start" font-size="8" fill="#1d2021">force_resume</text>
<text x="95.6" y="515" text-anchor="start" font-size="8" fill="#1d2021">1800</text>
<text x="322" y="515" text-anchor="start" font-size="8" fill="#6b7280" class="dim">_wait_for_resume's timeout (s)</text>
<text x="28" y="526" text-anchor="start" font-size="8" fill="#1d2021">tr</text>
<text x="95.6" y="526" text-anchor="start" font-size="8" fill="#1d2021">1</text>
<text x="129.6" y="526" text-anchor="start" font-size="8" fill="#6b7280" class="dim">(--tr)</text>
<text x="322" y="526" text-anchor="start" font-size="8" fill="#6b7280" class="dim">1: --router tr, 0: --router default</text>
<text x="28" y="537" text-anchor="start" font-size="8" fill="#1d2021">blocks</text>
<text x="95.6" y="537" text-anchor="start" font-size="8" fill="#1d2021">4000</text>
<text x="129.6" y="537" text-anchor="start" font-size="8" fill="#6b7280" class="dim">(--blocks)</text>
<text x="322" y="537" text-anchor="start" font-size="8" fill="#6b7280" class="dim">num_gpu_blocks of a replica</text>
<text x="28" y="548" text-anchor="start" font-size="8" fill="#1d2021">a</text>
<text x="95.6" y="548" text-anchor="start" font-size="8" fill="#1d2021">2e-4</text>
<text x="129.6" y="548" text-anchor="start" font-size="8" fill="#6b7280" class="dim">(--a)</text>
<text x="322" y="548" text-anchor="start" font-size="8" fill="#6b7280" class="dim">compute per scheduled token (s)</text>
<text x="28" y="559" text-anchor="start" font-size="8" fill="#1d2021">g</text>
<text x="95.6" y="559" text-anchor="start" font-size="8" fill="#1d2021">0</text>
<text x="129.6" y="559" text-anchor="start" font-size="8" fill="#6b7280" class="dim">(--g)</text>
<text x="322" y="559" text-anchor="start" font-size="8" fill="#6b7280" class="dim">prefill attention per token and context token (s)</text>
<text x="28" y="570" text-anchor="start" font-size="8" fill="#1d2021">omega</text>
<text x="95.6" y="570" text-anchor="start" font-size="8" fill="#1d2021">0.02</text>
<text x="129.6" y="570" text-anchor="start" font-size="8" fill="#6b7280" class="dim">(--omega)</text>
<text x="322" y="570" text-anchor="start" font-size="8" fill="#6b7280" class="dim">weights read per iteration (s)</text>
<text x="28" y="581" text-anchor="start" font-size="8" fill="#1d2021">beta</text>
<text x="95.6" y="581" text-anchor="start" font-size="8" fill="#1d2021">2e-7</text>
<text x="129.6" y="581" text-anchor="start" font-size="8" fill="#6b7280" class="dim">(--beta)</text>
<text x="322" y="581" text-anchor="start" font-size="8" fill="#6b7280" class="dim">KV read per iteration per resident context token (s)</text>
<text x="28" y="592" text-anchor="start" font-size="8" fill="#1d2021">S</text>
<text x="95.6" y="592" text-anchor="start" font-size="8" fill="#1d2021">0</text>
<text x="129.6" y="592" text-anchor="start" font-size="8" fill="#6b7280" class="dim">(--S)</text>
<text x="322" y="592" text-anchor="start" font-size="8" fill="#6b7280" class="dim">shared system prompt (tokens)</text>
<text x="28" y="603" text-anchor="start" font-size="8" fill="#1d2021">count_shared</text>
<text x="95.6" y="603" text-anchor="start" font-size="8" fill="#1d2021">1</text>
<text x="129.6" y="603" text-anchor="start" font-size="8" fill="#6b7280" class="dim">(--count_shared)</text>
<text x="322" y="603" text-anchor="start" font-size="8" fill="#6b7280" class="dim">1: S in every program, 0: once</text>
<text x="28" y="614" text-anchor="start" font-size="8" fill="#1d2021">w</text>
<text x="95.6" y="614" text-anchor="start" font-size="8" fill="#1d2021">1</text>
<text x="129.6" y="614" text-anchor="start" font-size="8" fill="#6b7280" class="dim">(--w)</text>
<text x="322" y="614" text-anchor="start" font-size="8" fill="#6b7280" class="dim">--acting-token-weight</text>
<text x="28" y="625" text-anchor="start" font-size="8" fill="#1d2021">room</text>
<text x="95.6" y="625" text-anchor="start" font-size="8" fill="#1d2021">64000</text>
<text x="129.6" y="625" text-anchor="start" font-size="8" fill="#6b7280" class="dim">= blocks * bs - (count_shared ? 0 : S)</text>
<text x="322" y="625" text-anchor="start" font-size="8" fill="#6b7280" class="dim">the router's capacity</text>
<text x="28" y="636" text-anchor="start" font-size="8" fill="#1d2021">dt</text>
<text x="95.6" y="636" text-anchor="start" font-size="8" fill="#1d2021">5</text>
<text x="129.6" y="636" text-anchor="start" font-size="8" fill="#6b7280" class="dim">(--dt)</text>
<text x="322" y="636" text-anchor="start" font-size="8" fill="#6b7280" class="dim">--scheduler-interval (s)</text>
<text x="28" y="647" text-anchor="start" font-size="8" fill="#1d2021">est</text>
<text x="95.6" y="647" text-anchor="start" font-size="8" fill="#1d2021">0</text>
<text x="129.6" y="647" text-anchor="start" font-size="8" fill="#6b7280" class="dim">(--est)</text>
<text x="322" y="647" text-anchor="start" font-size="8" fill="#6b7280" class="dim">the router's token estimate's relative error, at most</text>
<text x="28" y="663.5" text-anchor="start" font-size="10" fill="#1d2021">workload</text>
<text x="28" y="676.5" text-anchor="start" font-size="8" fill="#1d2021">p</text>
<text x="95.6" y="676.5" text-anchor="start" font-size="8" fill="#1d2021">0.9</text>
<text x="322" y="676.5" text-anchor="start" font-size="8" fill="#6b7280" class="dim">the agent continues after a turn</text>
<text x="28" y="687.5" text-anchor="start" font-size="8" fill="#1d2021">N</text>
<text x="95.6" y="687.5" text-anchor="start" font-size="8" fill="#1d2021">32</text>
<text x="129.6" y="687.5" text-anchor="start" font-size="8" fill="#6b7280" class="dim">(--N)</text>
<text x="322" y="687.5" text-anchor="start" font-size="8" fill="#6b7280" class="dim">agents at once</text>
<text x="28" y="698.5" text-anchor="start" font-size="8" fill="#1d2021">Z</text>
<text x="95.6" y="698.5" text-anchor="start" font-size="8" fill="#1d2021">3</text>
<text x="129.6" y="698.5" text-anchor="start" font-size="8" fill="#6b7280" class="dim">(--Z)</text>
<text x="322" y="698.5" text-anchor="start" font-size="8" fill="#6b7280" class="dim">mean tool time (s)</text>
</svg>
