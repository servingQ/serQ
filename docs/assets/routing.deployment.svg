<svg xmlns="http://www.w3.org/2000/svg" width="700" height="259" viewBox="0 0 700 259" role="img">
<style>
  text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e8e6e3; } text.dim { fill: #9aa4b2; }
    .bg { fill:#14171a }
    .solid { fill:#232a31;stroke:#b6bfcc }
    .cached { fill:#33302a }
    .instance { fill:#1a1f24;stroke:#b6bfcc }
    .frame { stroke:#b6bfcc }
    .server { stroke:#b6bfcc }
    .enclosure { stroke:#9aa4b2 }
    .station { fill:#26403d;stroke:#b6bfcc }
    .cell { fill:#14171a;stroke:#b6bfcc }
    .rail { stroke:#b6bfcc }
    .flow { stroke:#b6bfcc }
    .back { stroke:#b6bfcc }
    .poster { fill:#b6bfcc }
    .relation { stroke:#9aa4b2 }
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>
<rect class="bg" fill="#ffffff" x="0" y="0" width="700" height="259"/>
<rect class="server" fill="none" stroke="#4b5563" stroke-width="1.4" data-role="server" x="226" y="59" width="446" height="172" rx="12"/>
<g data-node="#0" data-role="decision">
<polygon class="station" fill="#d8e6e4" stroke="#4b5563" stroke-width="1.3" points="284,93 310,119 284,145 258,119"/>
</g>
<text x="284" y="85" text-anchor="middle" font-size="10" fill="#1d2021">choose j</text>
<g data-node="link" data-stage="link">
