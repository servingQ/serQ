[workspace]
members = ["cargo:."]

# dist builds the serq CLI for each target, the shell installer and the
# Homebrew formula, and writes .github/workflows/release.yml from this file
# (`dist generate`; edit here, not there). pyserq is the Python binding and
# has no binary, so dist leaves it alone.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Build only what is distributed (serq), not the whole workspace
precise-builds = true
# Whether to install an updater program
install-updater = false
# The formula goes to this tap (`brew install servingQ/tap/serq`); the
# homebrew job pushes it with the secret HOMEBREW_TAP_TOKEN
tap = "servingQ/homebrew-tap"
# Before anything is built: the full CI, and the tag is Cargo.toml's version
plan-jobs = ["./release-check"]
# pyserq's wheels, built beside the CLI and attached to the release
local-artifacts-jobs = ["./release-wheels"]
# After the GitHub release: the formula, pyserq to PyPI, the crate to crates.io
publish-jobs = ["homebrew", "./publish-pypi", "./publish-crates"]
# The release notes are the tag message's body, then the pull requests
post-announce-jobs = ["./release-notes"]
